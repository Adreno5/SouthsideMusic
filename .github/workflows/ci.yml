name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile
        run: uv run python -m compileall -q src tests scripts beat_test.py

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2 libegl1 libgl1 libxkbcommon-x11-0

      - name: Start Linux audio server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          $ffmpegPackage = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools'
          $ffmpegBinary = Get-ChildItem -LiteralPath $ffmpegPackage -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegBinary) { throw 'FFmpeg binary was not installed' }
          $ffmpegBinary.DirectoryName >> $env:GITHUB_PATH
          $env:PATH = "$($ffmpegBinary.DirectoryName);$env:PATH"
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg verification failed' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe verification failed' }

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare free-threaded worker
        shell: bash
        run: uv run --frozen python -c "import os, sys; from pathlib import Path; sys.path.insert(0, 'tests'); from harness.environment import prepareWorker; worker = prepareWorker(Path('.').resolve()); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('SOUTHSIDE_FREE_THREADED_PYTHON=' + worker + '\n')"

      - name: Unit tests
        run: uv run --frozen python scripts/test_harness.py unit --report-dir .harness-results/unit

      - name: Harness
        run: uv run --frozen python scripts/test_harness.py run --group core --group online --report-dir .harness-results/run

      - name: Summary
        if: always()
        shell: bash
        run: |
          for report in .harness-results/unit/unit-summary.md .harness-results/run/summary.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .harness-results/unit/unit-results.json
            .harness-results/unit/unit-results.xml
            .harness-results/unit/unit-summary.md
            .harness-results/unit/unit-logs/
            .harness-results/run/
            !.harness-results/run/**/worker/**
            !.harness-results/run/**/.venv/**
            !.harness-results/run/**/torch_venv/**
            !.harness-results/run/**/freethreaded_venv/**
            !.harness-results/run/**/src/**
            !.harness-results/run/**/tests/**
            !.harness-results/run/**/scripts/**
            !.harness-results/run/**/fonts/**
            !.harness-results/run/**/icons/**
            !.harness-results/run/**/images/**
            !.harness-results/run/**/ffmpeg/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
