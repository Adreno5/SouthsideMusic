name: AutoRelease
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $pyproject = (Select-String pyproject.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $installer = (Select-String installer.iss -Pattern '^#define AppVersion "(.+)"$').Matches[0].Groups[1].Value

          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = $pyproject
          }

          Write-Output "trigger   = ${{ github.event_name }}"
          Write-Output "pyproject = $pyproject"
          Write-Output "installer = $installer"
          Write-Output "version   = $tag"

          if ($installer -ne $pyproject) {
            throw "installer.iss 是 $installer, pyproject.toml 是 $pyproject; 先跑 updates.bat"
          }
          if ($tag -ne $pyproject) {
            throw "tag 是 $tag, pyproject.toml 是 $pyproject; 推 tag 前先跑 updates.bat 改成 $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Cache build inputs
        uses: actions/cache@v6
        with:
          path: |
            embed_python
            freethreaded_python
            build_venv
          key: build-inputs-${{ runner.os }}-${{ hashFiles('.requirements_sha256', 'embed_python_requirements.txt', '.python-version') }}
          
      - name: Install icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Prepare build environment
        shell: cmd
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
        run: python setup_workspace.py --build-only < nul
        
      - name: Build
        shell: cmd
        run: build.bat < nul
        
      - name: Verify build output
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $root = (Get-Location).Path
          $exe = Join-Path $root "build.result\installer\SouthsideMusic_${tag}_win64_setup.exe"
          $required = @(
            $exe,
            (Join-Path $root 'build.result\raw\launcher\Launch.exe'),
            (Join-Path $root 'build.result\raw\python\python.exe'),
            (Join-Path $root 'build.result\raw\freethreaded_python\python.exe'),
            (Join-Path $root 'build.result\raw\src\main.py'),
            (Join-Path $root 'build.result\raw\bootstrap.py')
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "缺少产物: $path" }
          }
          Get-Item $exe | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) }}
          Get-ChildItem 'build.result\raw' | Select-Object Name
          
      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $root = (Get-Location).Path
          $zip = Join-Path $root "build.result\Southside_${tag}_Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { throw "没找到 7-Zip: $sevenZip" }
          Push-Location (Join-Path $root 'build.result\raw')
          try {
            & $sevenZip a -tzip -mx=5 -mmt=on $zip '*'
            if ($LASTEXITCODE -ne 0) { throw "7z 退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $names = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }) }
          finally { $archive.Dispose() }
          foreach ($required in @('bootstrap.py', 'launcher/Launch.exe', 'src/main.py', 'python/python.exe')) {
            if ($names -notcontains $required) { throw "Portable.zip 缺少 $required" }
          }
          Write-Output "portable entries: $($names.Count)"
          Get-Item $zip | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: SouthsideMusic-${{ steps.version.outputs.tag }}-installer
          path: build.result/installer/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: SouthsideMusic-${{ steps.version.outputs.tag }}-portable
          path: build.result/Southside_*_Portable.zip
          if-no-files-found: error
          retention-days: 7
