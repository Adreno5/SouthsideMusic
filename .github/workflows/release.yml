name: AutoRelease
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $pyproject = (Select-String pyproject.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $installer = (Select-String installer.iss -Pattern '^#define AppVersion "(.+)"$').Matches[0].Groups[1].Value

          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = $pyproject
          }

          Write-Output "trigger   = ${{ github.event_name }}"
          Write-Output "pyproject = $pyproject"
          Write-Output "installer = $installer"
          Write-Output "version   = $tag"

          if ($installer -ne $pyproject) {
            throw "installer.iss 是 $installer, pyproject.toml 是 $pyproject; 先跑 updates.bat"
          }
          if ($tag -ne $pyproject) {
            throw "tag 是 $tag, pyproject.toml 是 $pyproject; 推 tag 前先跑 updates.bat 改成 $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Read it back
        shell: pwsh
        run: echo "version step produced tag = ${{ steps.version.outputs.tag }}"
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Cache build inputs
        uses: actions/cache@v6
        with:
          path: |
            embed_python
            freethreaded_python
            build_venv
          key: build-inputs-${{ runner.os }}-${{ hashFiles('.requirements_sha256', 'embed_python_requirements.txt', '.python-version') }}
          
      - name: Install icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Prepare build environment
        shell: cmd
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
        run: python setup_workspace.py --build-only < nul